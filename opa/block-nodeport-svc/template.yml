apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblocknodeport
  annotations:
    metadata.gatekeeper.sh/title: "Block NodePort"
    metadata.gatekeeper.sh/version: 1.0.0
    description: >-
      Disallows all Services with type NodePort.

      https://kubernetes.io/docs/concepts/services-networking/service/#nodeport

spec:
  crd:
    spec:
      names:
        kind: K8sBlockNodePort

  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblocknodeport

        violation[{"msg": msg}] {
          input.review.kind.kind == "Service"             # Ensure the kind is Service
          input.review.object.spec.type == "NodePort"     # Check if the service type is NodePort
          nss := {"kube-system", "gatekeeper-system"}     # Define permissive namespaces
          input.review.object.metadata.namespace == nss[_] # Namespace should not be in the permissive list
          msg := "NodePort services are not allowed in this cluster."
        }

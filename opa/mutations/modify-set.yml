# Remove argmuent `--alsologtostderr` from all containers using ModifySet

apiVersion: mutations.gatekeeper.sh/v1
kind: ModifySet
metadata:
  name: remove-err-logging
spec:
  applyTo:
  - groups: [""]
    kinds: ["Pod"]
    versions: ["v1"]
  location: "spec.containers[name: *].args"
  parameters:
    operation: prune
    values:
      fromList:
        - --alsologtostderr

---

# Merge argmuent `sh echo 'Hello world'` to all busybox containers using ModifySet

apiVersion: mutations.gatekeeper.sh/v1
kind: ModifySet
metadata:
  name: remove-err-logging
spec:
  applyTo:
  - groups: [""]
    kinds: ["Pod"]
    versions: ["v1"]
  location: "spec.containers[name: busybox].args"
  parameters:
    operation: merge
    values:
      fromList:
        - "sh echo 'Hello world'"
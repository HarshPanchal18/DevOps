apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: calico-no-access
rules:
- apiGroups: ["crd.projectcalico.org", "projectcalico.org"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user1-calico-deny
subjects:
- kind: User
  name: user1  # Exact username from kubeconfig
roleRef:
  kind: ClusterRole
  name: calico-no-access
  apiGroup: rbac.authorization.k8s.io

# Create user CSR
# openssl genrsa -out user1.key 2048
# openssl req -new -key user1.key -out user1.csr

# Approve CSR
# openssl x509 -req -in user1.csr -CA /etc/kubernetes/pki/ca.crt -CAkey /etc/kubernetes/pki/ca.key -CAcreateserial -out user1.crt -days 500

# OR
# Create a new private key and certificate for user1
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout user1.key \
#   -out user1.crt \
#   -subj "/CN=user1/O=dev/O=example.org"


# Create Role
apiVersion: rbac.authorization.k8s.io/v1beta1
kind: Role
metadata:
  namespace: test-namespace
  name: user1-role
rules:
- apiGroups: ["", "extensions", "apps"]
  resources: ["deployments", "pods", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---

# Create RoleBindings
apiVersion: rbac.authorization.k8s.io/v1beta1
kind: RoleBinding
metadata:
  name: user1-rolebinding
  namespace: test-namespace
subjects:
  - kind: User
    name: user1
    apiGroup: ""
roleRef:
  kind: Role
  name: user1-role
  apiGroup: ""

# Create User and Context in Kubernetes
# kubectl config set-credentials user1 --client-certificate=user1.crt --client-key=user1.key
# kubectl config set-context user1-context --cluster=kind-kind-kube --namespace=default --user=user1

# Verify the user creation
# tail ~/.kube/config

# Get contexts
# kubectl config get-contexts

# Switch context
# kubectl config use-context user1-kube



# To delete user
# kubectl config delete-user user1